name: unsplash_wallpapers_app
description: "Proyecto Final - Unsplash Wallpapers App con Riverpod y Clean Architecture"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0

  # Persistencia Local
  shared_preferences: ^2.2.2

  # Navegación
  go_router: ^13.2.0

  # Imágenes
  cached_network_image: ^3.3.1

  # Modelos
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Conectividad
  connectivity_plus: ^5.0.2

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
